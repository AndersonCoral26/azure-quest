<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>Azure Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#eef3f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08111f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Azure Quest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: app de una columna (máx 560px) estilo cuaderno de vuelo; barra de pestañas fija abajo, vistas a pantalla completa para lección/quiz/examen */
:root {
  --bg: #eef3f9; --surface: #ffffff; --surface-2: #f6f9fd; --ink: #0c1a2c; --muted: #56677f; --line: #d6e0ec;
  --accent: #0a62d0; --accent-ink: #ffffff; --accent-soft: #e2edfb;
  --gold: #c98a06; --gold-soft: #fdf1d6;
  --ok: #17864a; --ok-soft: #dff4e7; --bad: #c9302c; --bad-soft: #fbe6e5;
  --shadow: 0 1px 2px rgba(12,26,44,.06), 0 6px 18px rgba(12,26,44,.06);
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #08111f; --surface: #101b2e; --surface-2: #0c1627; --ink: #e5edf8; --muted: #93a4bc; --line: #22324b;
  --accent: #4d9bff; --accent-ink: #04101f; --accent-soft: #13284a;
  --gold: #f0b52e; --gold-soft: #3a2c0b;
  --ok: #43c97d; --ok-soft: #0f2e1d; --bad: #ff6f69; --bad-soft: #3b1514;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #08111f; --surface: #101b2e; --surface-2: #0c1627; --ink: #e5edf8; --muted: #93a4bc; --line: #22324b;
  --accent: #4d9bff; --accent-ink: #04101f; --accent-soft: #13284a;
  --gold: #f0b52e; --gold-soft: #3a2c0b;
  --ok: #43c97d; --ok-soft: #0f2e1d; --bad: #ff6f69; --bad-soft: #3b1514;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark }

* { box-sizing: border-box }
html, body { min-height: 100% }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body); -webkit-tap-highlight-color: transparent; overflow-x: hidden }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg) }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15 }
p { margin: 0 }
code { font-family: var(--mono); font-size: .86em; background: var(--accent-soft); padding: 1px 5px; border-radius: 5px }
strong { font-weight: 700 }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.eyebrow { font: 600 11.5px/1.2 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted) }

#app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px }
body.fs #app { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)) }

/* Pestañas */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)) }
#tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr) }
#tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 0 8px; font-size: 11.5px; font-weight: 600; color: var(--muted); position: relative }
#tabs button svg { width: 22px; height: 22px }
#tabs button[aria-current="page"] { color: var(--accent) }
#tabs .dot { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 10.5px; line-height: 17px; padding: 0 4px }
body.fs #tabs { display: none }

/* Cabecera */
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 8px }
.brand { display: flex; align-items: center; gap: 10px }
.brand .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center }
.brand h1 { font-size: 21px; font-weight: 800; letter-spacing: -.01em }
.brand small { display: block; white-space: nowrap; font: 600 11px/1 var(--mono); color: var(--muted); letter-spacing: .04em }
.chips { display: flex; gap: 6px }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 9px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font: 600 13px/1 var(--mono) }
.chip svg { width: 15px; height: 15px }
.chip.fire { color: #e2581b } .chip.xp { color: var(--gold) }

/* Tarjetas genéricas */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow) }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 12px; font-weight: 700; font-size: 16px; background: var(--accent); color: var(--accent-ink); transition: transform .08s, opacity .15s }
.btn:active { transform: scale(.98) }
.btn[disabled] { opacity: .4; cursor: default }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line) }
.btn.ok { background: var(--ok); color: #fff } .btn.bad { background: var(--bad); color: #fff }
.btn.block { width: 100% }
.btn svg { width: 18px; height: 18px }
.row { display: flex; gap: 10px; flex-wrap: wrap } .row > .btn { flex: 1 1 140px }

/* Continuar */
.hero { background: var(--accent); color: var(--accent-ink); border-radius: 18px; padding: 18px; display: grid; gap: 12px; position: relative; overflow: hidden }
.hero .eyebrow { color: inherit; opacity: .8 }
.hero h2 { font-size: 24px; font-weight: 800 }
.hero p { opacity: .88; font-size: 14.5px }
.hero .btn { background: var(--accent-ink); color: var(--accent); justify-self: start }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; border: 22px solid currentColor; opacity: .09 }

/* Medidor de preparación */
.ready { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: center }
.gauge { position: relative; width: 120px; height: 72px }
.gauge svg { width: 120px; height: 72px; overflow: visible }
.gauge b { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font: 700 22px/1 var(--mono) }
.gauge b small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 500; margin-top: 2px }
@media (max-width: 440px) { .ready { grid-template-columns: minmax(0, 1fr); justify-items: center } .ready .wbars { width: 100% } }
.wbars { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0 }
.wbar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; font-size: 12.5px; min-width: 0 }
.wbar .lbl span:last-child { flex: none }
.wbar .lbl { display: flex; justify-content: space-between; gap: 8px; color: var(--muted) }
.wbar .lbl span:first-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); font-weight: 600 }
.track { height: 7px; border-radius: 9px; background: var(--line); overflow: hidden }
.track i { display: block; height: 100%; background: var(--accent); border-radius: 9px; transition: width .4s }
.track.ok i { background: var(--ok) }

/* Mapa de mundos */
.world { display: grid; gap: 4px }
.world-h { display: grid; gap: 4px; padding: 6px 2px 8px }
.world-h .er { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.world-h h2 { font-size: 19px; font-weight: 800 }
.world-h .w { font: 600 12px/1 var(--mono); color: var(--accent); background: var(--accent-soft); padding: 5px 7px; border-radius: 6px; white-space: nowrap }
.path { display: grid; position: relative }
.path::before { content: ""; position: absolute; left: 21px; top: 22px; bottom: 22px; width: 2px; background: repeating-linear-gradient(var(--line) 0 6px, transparent 6px 11px) }
.lvl { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 8px 0; text-align: left; width: 100%; position: relative }
.node { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 700 15px/1 var(--mono); background: var(--surface); border: 2px solid var(--line); color: var(--muted); z-index: 1 }
.node svg { width: 20px; height: 20px }
.lvl.open .node { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 5px var(--accent-soft) }
.lvl.done .node { background: var(--ok); border-color: var(--ok); color: #fff }
.lvl.boss .node { border-radius: 12px }
.lvl.boss.open .node { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 0 5px var(--gold-soft); color: #fff }
.lvl.locked { opacity: .55 }
.lvl .t { min-width: 0 }
.lvl .t b { display: block; font-weight: 700; font-size: 15.5px; line-height: 1.25 }
.lvl .t small { color: var(--muted); font-size: 12.5px }
.stars { display: flex; gap: 1px; color: var(--line) }
.stars svg { width: 16px; height: 16px }
.stars .on { color: var(--gold) }

/* Pantalla completa: barra superior y dock inferior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--bg); display: flex; align-items: center; gap: 12px; padding-block: 10px; margin-inline: -4px }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); flex: none }
.icon-btn svg { width: 22px; height: 22px }
.top .track { flex: 1; height: 10px }
.top .count { font: 600 13px/1 var(--mono); color: var(--muted); min-width: 44px; text-align: right }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 18; background: var(--surface); border-top: 1px solid var(--line); padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transition: background .2s }
.dock .in { max-width: 528px; margin: 0 auto; display: grid; gap: 10px }
.dock.ok { background: var(--ok-soft); border-color: var(--ok) } .dock.bad { background: var(--bad-soft); border-color: var(--bad) }
.fb h3 { font-size: 19px; display: flex; align-items: center; gap: 8px }
.dock.ok .fb h3 { color: var(--ok) } .dock.bad .fb h3 { color: var(--bad) }
.fb h3 svg { width: 22px; height: 22px }
.fb p { font-size: 14.5px; margin-top: 4px; max-height: 32vh; overflow-y: auto }

/* Nivel */
.lvl-hero { display: grid; gap: 8px; padding-top: 4px }
.lvl-hero h1 { font-size: 28px; font-weight: 800 }
.lvl-hero .goal { font-size: 16px; color: var(--muted) }
.opts-list { display: grid; gap: 10px }
.action { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%; padding: 14px }
.action .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent) }
.action .ic svg { width: 22px; height: 22px }
.action b { display: block; font-size: 16px } .action small { color: var(--muted); font-size: 13px }
.action .go { color: var(--muted) } .action .go svg { width: 20px; height: 20px }
.action[disabled] { opacity: .5; cursor: default }

/* Bloques de lección */
.lesson { display: grid; gap: 16px }
.blk { animation: rise .35s ease both; display: grid; gap: 10px }
@keyframes rise { from { transform: translateY(10px); opacity: .2 } to { transform: none; opacity: 1 } }
.blk h3 { font-size: 19px; font-weight: 700 }
.blk .body { font-size: 16.5px; line-height: 1.6 }
.blk .hint { font-size: 13px; color: var(--muted) }
.callout { border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; font-size: 15.5px }
.callout .eyebrow { display: flex; gap: 6px; align-items: center }
.callout .eyebrow svg { width: 15px; height: 15px }
.callout.analogy { background: var(--accent-soft) } .callout.analogy .eyebrow { color: var(--accent) }
.callout.trap { background: var(--gold-soft); border: 1px dashed var(--gold) } .callout.trap .eyebrow { color: var(--gold) }
.carousel { display: grid; grid-auto-flow: column; grid-auto-columns: 84%; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; margin-inline: -2px; padding-inline: 2px; scrollbar-width: none }
.carousel::-webkit-scrollbar { display: none }
.ccard { scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 6px; align-content: start; min-height: 140px }
.ccard .n { font: 600 11px/1 var(--mono); color: var(--accent) }
.ccard b { font-family: var(--display); font-size: 18px; line-height: 1.2 }
.ccard p { font-size: 15px; color: var(--muted) }
.dots { display: flex; gap: 5px; justify-content: center } .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: width .2s } .dots i.on { width: 16px; background: var(--accent) }
.flips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px }
.flip { perspective: 800px; min-height: 120px; text-align: left; padding: 0 }
.flip .in { position: relative; width: 100%; height: 100%; min-height: 120px; transition: transform .45s; transform-style: preserve-3d; display: grid }
.flip.on .in { transform: rotateY(180deg) }
.flip .f, .flip .b { grid-area: 1/1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--r); padding: 14px; display: grid; align-content: center; gap: 4px }
.flip .f { background: var(--surface); border: 1px solid var(--line); font-family: var(--display); font-weight: 700; font-size: 16.5px }
.flip .f small { font: 500 11px/1 var(--body); color: var(--muted) }
.flip .b { background: var(--accent); color: var(--accent-ink); transform: rotateY(180deg); font-size: 14px }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 100% }
.tbl th, .tbl td { padding: 9px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line) }
.tbl th { font: 700 13px/1.2 var(--display); background: var(--surface-2) }
.tbl td:first-child { font-weight: 600; color: var(--muted) }
.tbl tr:last-child td { border-bottom: 0 }
.pool, .bucket .got { display: flex; flex-wrap: wrap; gap: 8px }
.pool { min-height: 44px }
.tag { padding: 9px 12px; border-radius: 10px; background: var(--surface); border: 1.5px solid var(--line); font-size: 14.5px; font-weight: 600; text-align: left; transition: transform .1s }
.tag.sel { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-2px) }
.tag.placed { background: var(--ok-soft); border-color: transparent; color: var(--ok); font-weight: 600; cursor: default }
.buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; position: sticky; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--bg); padding-block: 6px; z-index: 2 }
.pool .tag { font-size: 14px; padding: 7px 10px }
.bucket { border: 2px dashed var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 80px; text-align: left }
.bucket > span { font: 800 14px/1.2 var(--display) }
.bucket .got .tag { font-size: 13px; padding: 6px 9px }
.shake { animation: shake .35s }
@keyframes shake { 25% { transform: translateX(-6px) } 50% { transform: translateX(6px) } 75% { transform: translateX(-3px) } }
.flash-bad { border-color: var(--bad) !important; background: var(--bad-soft) !important }
.seq { display: grid; gap: 6px; counter-reset: s }
.seq .it { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--ok-soft); color: var(--ok); font-weight: 600; counter-increment: s }
.seq .it::before { content: counter(s); font: 700 13px/1 var(--mono); width: 24px; height: 24px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; flex: none }
.done-note { font-size: 14px; color: var(--ok); font-weight: 700; display: flex; gap: 6px; align-items: center }
.done-note svg { width: 18px; height: 18px }
.kp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px }
.kp ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px }
.kp li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 15px }
.kp li svg { width: 20px; height: 20px; color: var(--ok); margin-top: 1px }

/* Preguntas */
.qwrap { display: grid; gap: 16px }
.q-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.q-text { font: 600 19px/1.4 var(--body) }
.blank { display: inline-block; min-width: 90px; border-bottom: 2.5px solid var(--accent); color: var(--accent); padding: 0 4px; text-align: center }
.opts { display: grid; gap: 10px }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; text-align: left; padding: 13px 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; font-size: 15.5px; transition: border-color .12s, background .12s }
.opt .k { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--line); display: grid; place-items: center; font: 700 13px/1 var(--mono); color: var(--muted) }
.opt.multi .k { border-radius: 6px }
.opt.sel { border-color: var(--accent); background: var(--accent-soft) } .opt.sel .k { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.opt.right { border-color: var(--ok); background: var(--ok-soft) } .opt.right .k { background: var(--ok); border-color: var(--ok); color: #fff }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft) } .opt.wrong .k { background: var(--bad); border-color: var(--bad); color: #fff }
.opt[disabled] { cursor: default }
.yn { display: grid; gap: 10px }
.yn-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; font-size: 15px }
.yn-row.right { border-color: var(--ok) } .yn-row.wrong { border-color: var(--bad); background: var(--bad-soft) }
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden }
.seg button { padding: 8px 12px; font-weight: 700; font-size: 14px; min-width: 50px }
.seg button.sel { background: var(--accent); color: var(--accent-ink) }
.seg button.right { background: var(--ok); color: #fff } .seg button.wrong { background: var(--bad); color: #fff }
.match { display: grid; gap: 10px }
.m-row { display: grid; gap: 6px; padding: 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px }
.m-row b { font-size: 15px }
.m-row select { font: inherit; font-size: 15px; padding: 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); width: 100%; min-width: 0 }
.m-row.right { border-color: var(--ok) } .m-row.wrong { border-color: var(--bad); background: var(--bad-soft) }
.m-row .fix { font-size: 13px; color: var(--ok); font-weight: 600 }
.why { font-size: 14.5px; background: var(--surface-2); border-radius: 12px; padding: 12px 14px; border: 1px solid var(--line) }

/* Resultados */
.result { display: grid; gap: 14px; justify-items: center; text-align: center; padding-top: 16px }
.result h1 { font-size: 30px; font-weight: 800 }
.big { font: 700 54px/1 var(--mono) }
.result .stars svg { width: 34px; height: 34px }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; font-weight: 700; font-size: 14px }
.pill.ok { background: var(--ok-soft); color: var(--ok) } .pill.bad { background: var(--bad-soft); color: var(--bad) } .pill.gold { background: var(--gold-soft); color: var(--gold) }
.list { display: grid; gap: 10px; width: 100%; text-align: left }
details.rev { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px }

    // ───────────────────────── NIVEL 2 ─────────────────────────
    { id: 'w1l2', title: 'Ventajas de la nube', minutes: 6,
      goal: 'Reconocer cada ventaja de la nube (disponibilidad, escalabilidad, confiabilidad, previsibilidad, seguridad, gobernanza y administración) en un escenario.',
      lesson: [
        { type: 'text', title: 'Las ventajas que pregunta el examen',
          body: 'Microsoft agrupa los beneficios de la nube en: **alta disponibilidad**, **escalabilidad** (y elasticidad), **confiabilidad**, **previsibilidad** (de rendimiento y de costos), **seguridad y gobernanza** y **capacidad de administración**. El examen te da un escenario y te pide nombrar la ventaja: aprende la palabra clave de cada una.' },
        { type: 'compare', title: 'SLA: cuánto puede caerse un servicio',
          head: ['', 'Al mes', 'Al año'],
          rows: [
            ['99 %', '~7,3 h', '~3,65 días'],
            ['99,9 %', '~43,8 min', '~8,76 h'],
            ['99,95 %', '~21,9 min', '~4,38 h'],
            ['99,99 %', '~4,4 min', '~52,6 min'],
            ['99,999 %', '~26 s', '~5,3 min']
          ] },
        { type: 'text', title: 'Alta disponibilidad y SLA',
          body: '**Alta disponibilidad** = mantener el servicio accesible pese a fallos. Se mide con el **SLA** (acuerdo de nivel de servicio): el compromiso formal de Microsoft de tiempo de actividad. Si no lo cumple, normalmente compensa con **créditos de servicio**. Cada "9" extra reduce unas 10 veces la inactividad permitida.' },
        { type: 'analogy',
          body: 'Un restaurante en hora punta. **Escalar verticalmente** es cambiar la cocina por una más grande y potente (misma cocina, más capacidad). **Escalar horizontalmente** es abrir más cocinas y repartir pedidos. **Elasticidad** es que el local abra y cierre cocinas solo, según la cola de clientes, para no pagar personal ocioso.' },
        { type: 'cards', title: 'Escalabilidad',
          items: [
            { title: 'Vertical (scale up)', body: 'Más **CPU o RAM** a la misma máquina. También se puede reducir (scale down).' },
            { title: 'Horizontal (scale out)', body: 'Más **instancias** del recurso, normalmente detrás de un equilibrador de carga. Reducir instancias = scale in.' },
            { title: 'Elasticidad', body: 'Ajuste **automático** al alza y a la baja según la demanda. Pagas solo por lo que usas en cada momento.' },
            { title: 'Escalado automático', body: 'Reglas basadas en métricas (CPU, cola, horario) que añaden o quitan recursos sin intervención humana.' }
          ] },
        { type: 'flip', title: 'El resto de ventajas',
          items: [
            { front: 'Confiabilidad', back: 'Capacidad de **recuperarse de fallos** y seguir funcionando. Azure tiene un **diseño descentralizado**: regiones en todo el mundo para resistir desastres.' },
            { front: 'Previsibilidad de rendimiento', back: 'Saber que la app rendirá: escalado automático, equilibrio de carga y alta disponibilidad.' },
            { front: 'Previsibilidad de costos', back: 'Prever y controlar el gasto: calculadora de precios, calculadora de TCO, Microsoft Cost Management.' },
            { front: 'Seguridad', back: 'En IaaS controlas parches y SO; en **PaaS/SaaS** el proveedor aplica parches automáticamente.' },
            { front: 'Gobernanza', back: '**Plantillas** que imponen estándares, auditoría de recursos no conformes y apoyo al **cumplimiento** normativo.' }
          ] },
        { type: 'compare', title: 'Capacidad de administración',
          head: ['', 'De la nube', 'En la nube'],
          rows: [
            ['Idea', 'Lo que la nube hace por ti', 'Cómo administras tú la nube'],
            ['Ejemplos', 'Escalado automático, supervisión y alertas, reemplazo de recursos con fallo', 'Azure portal, Azure CLI, PowerShell, API, plantillas ARM/Bicep']
          ] },
        { type: 'sort', title: '¿Administración de la nube o en la nube?', buckets: ['De la nube', 'En la nube'],
          items: [
            { text: 'Escalar según la demanda automáticamente', bucket: 0 },
            { text: 'Usar el Azure portal', bucket: 1 },
            { text: 'Recibir alertas automáticas de métricas', bucket: 0 },
            { text: 'Ejecutar scripts con Azure CLI', bucket: 1 },
            { text: 'Desplegar con una plantilla de Bicep', bucket: 1 },
            { text: 'Reemplazar automáticamente recursos con fallo', bucket: 0 }
          ] },
        { type: 'check', q: 'Un servicio tiene un SLA del 99,99 %. ¿Aproximadamente cuánto tiempo de inactividad al mes permite?',
          o: ['43 minutos', '4,4 minutos', '7 horas'], a: 1,
          why: '99,99 % permite unos 4,4 minutos al mes. 43 minutos corresponden a 99,9 % y unas 7 horas a 99 %.' },
        { type: 'trap',
          body: 'No confundas **escalabilidad** (poder crecer) con **elasticidad** (crecer y decrecer automáticamente). Tampoco **alta disponibilidad** (estar accesible, SLA) con **confiabilidad** (recuperarse de fallos). Y ojo: un SLA del 99,99 % **no garantiza cero caídas**, garantiza compensación si se incumple.' },
        { type: 'keypoints',
          items: [
            '99,9 % ≈ 43,8 min/mes; 99,99 % ≈ 4,4 min/mes. Más nueves = menos inactividad.',
            'Vertical = más potencia a una máquina; horizontal = más máquinas.',
            'Elasticidad = escalar automáticamente arriba y abajo según la demanda.',
            'Confiabilidad = recuperarse de fallos gracias al diseño descentralizado.',
            'En PaaS y SaaS el proveedor aplica los parches; en IaaS, tú.',
            'De la nube = automático (escalado, alertas); en la nube = portal, CLI, API, plantillas.'
          ] }
      ],
      questions: [
        { t: 'single', q: 'Un servicio tiene un SLA del 99,99 %. ¿Cuál es aproximadamente el tiempo de inactividad máximo al mes?',
          o: ['43 minutos', '8,7 horas', '4,4 minutos', '26 segundos'], a: 2,
          why: '99,99 % equivale a unos 4,4 minutos al mes. 43 minutos son 99,9 % al mes, 8,7 horas son 99,9 % al año y 26 segundos son 99,999 % al mes.', d: 2 },
        { t: 'single', q: '¿Cuál de estos SLA ofrece la mayor disponibilidad?',
          o: ['99,99 %', '99,9 %', '99,95 %', '99 %'], a: 0,
          why: 'Cuantos más nueves, menos inactividad permitida. 99,99 % es el porcentaje más alto de la lista.', d: 1 },
        { t: 'single', q: 'Un administrador cambia una VM a un tamaño con más vCPU y más memoria. ¿Qué está haciendo?',
          o: ['Escalado horizontal', 'Elasticidad', 'Alta disponibilidad', 'Escalado vertical'], a: 3,
          why: 'Aumentar la capacidad de una misma máquina es escalado vertical. El horizontal añade instancias; la elasticidad es ajuste automático.', d: 1 },
        { t: 'single', q: 'Para soportar más usuarios, un equipo añade dos instancias más de su aplicación detrás de un equilibrador de carga. ¿Qué concepto aplica?',
          o: ['Escalado vertical', 'Escalado horizontal', 'Recuperación ante desastres', 'Gobernanza'], a: 1,
          why: 'Añadir instancias es escalado horizontal (scale out). El vertical mejora una sola máquina; recuperación y gobernanza son otros conceptos.', d: 1 },
        { t: 'single', q: 'Una tienda en línea añade servidores automáticamente durante una campaña de ofertas y los elimina cuando el tráfico baja. ¿Qué ventaja de la nube describe esto?',
          o: ['Previsibilidad de costos', 'Confiabilidad', 'Elasticidad', 'Administración en la nube'], a: 2,
          why: 'Ajustar recursos automáticamente al alza y a la baja según la demanda es elasticidad. La confiabilidad trata de recuperarse de fallos.', d: 1 },
        { t: 'single', q: '¿Qué ventaja de la nube describe la capacidad de un sistema de recuperarse de errores y seguir funcionando?',
          o: ['Escalabilidad', 'Elasticidad', 'Gobernanza', 'Confiabilidad'], a: 3,
          why: 'La confiabilidad es recuperarse de fallos y continuar operando. Escalabilidad y elasticidad tratan de capacidad; gobernanza, de estándares.', d: 1 },
        { t: 'single', q: 'Antes de migrar, una empresa estima su factura mensual con la calculadora de precios y luego sigue el gasto con Microsoft Cost Management. ¿Qué ventaja aprovecha?',
          o: ['Previsibilidad de costos', 'Alta disponibilidad', 'Escalado vertical', 'Seguridad física'], a: 0,
          why: 'Estimar y controlar el gasto es previsibilidad de costos. Las demás opciones no tienen relación con prever la factura.', d: 1 },
        { t: 'single', q: 'Una organización obliga a que todos los recursos se desplieguen desde plantillas aprobadas que cumplen sus normas corporativas. ¿Qué ventaja de la nube aplica?',
          o: ['Elasticidad', 'Gobernanza', 'Previsibilidad de rendimiento', 'Escalado horizontal'], a: 1,
          why: 'Imponer estándares y cumplimiento mediante plantillas es gobernanza. Elasticidad y escalado hablan de capacidad; previsibilidad de rendimiento, de cómo responde la app.', d: 2 },
        { t: 'single', q: '¿En qué tipo de servicio el proveedor aplica automáticamente los parches del sistema operativo?',
          o: ['IaaS', 'Centro de datos local', 'PaaS', 'En ninguno; siempre lo hace el cliente'], a: 2,
          why: 'En PaaS (y SaaS) el proveedor mantiene el SO y aplica los parches. En IaaS y en local, esa tarea es del cliente.', d: 2 },
        { t: 'single', q: 'Un administrador crea y modifica recursos de Azure ejecutando scripts con Azure CLI. ¿Qué aspecto de la capacidad de administración representa?',
          o: ['Administración en la nube', 'Administración de la nube', 'Escalado automático', 'Alta disponibilidad'], a: 0,
          why: 'Administración en la nube es cómo tú administras: portal, CLI, API, plantillas. Administración de la nube es lo que la nube hace automáticamente, como escalar.', d: 2 },
        { t: 'single', q: 'Azure supervisa una aplicación, envía alertas cuando sube el uso de CPU y reemplaza automáticamente las instancias con fallo. ¿Qué aspecto representa?',
          o: ['Gobernanza', 'Administración en la nube', 'Previsibilidad de costos', 'Administración de la nube'], a: 3,
          why: 'Lo que la nube hace por sí sola (supervisar, alertar, reemplazar, escalar) es administración de la nube. Administración en la nube es la que tú haces con portal, CLI o API.', d: 2 },
        { t: 'single', q: '¿Qué es un acuerdo de nivel de servicio (SLA) en Azure?',
          o: ['Un contrato de licencia de software', 'Un acuerdo formal que define la disponibilidad comprometida de un servicio y las compensaciones si no se cumple', 'Una herramienta para escalar máquinas virtuales', 'Una plantilla de implementación'], a: 1,
          why: 'El SLA es el compromiso de disponibilidad de Microsoft y define créditos de servicio si se incumple. No es una licencia, ni una herramienta de escalado, ni una plantilla.', d: 1 },
        { t: 'single', q: 'Gracias al diseño descentralizado de Azure, ¿qué puede hacer una empresa para mejorar la confiabilidad?',
          o: ['Eliminar su responsabilidad sobre los datos', 'Convertir su gasto en CapEx', 'Desplegar recursos en varias regiones para seguir operando si una falla', 'Escalar verticalmente sin ningún límite'], a: 2,
          why: 'Con regiones en todo el mundo, puedes distribuir recursos para resistir el fallo de una ubicación. Los datos siguen siendo tuyos, la nube es OpEx y el escalado vertical tiene límites.', d: 2 },
        { t: 'multi', q: '¿Qué dos acciones son ejemplos de escalado vertical? Selecciona dos.',
          o: ['Aumentar la RAM de una máquina virtual', 'Agregar instancias a un conjunto de escalado de máquinas virtuales', 'Cambiar la VM a un tamaño con más vCPU', 'Agregar otro servidor detrás del equilibrador de carga'], a: [0, 2],
          why: 'Más RAM o más vCPU en la misma VM es escalado vertical. Agregar instancias o servidores es escalado horizontal.', d: 1 },
        { t: 'multi', q: '¿Qué dos son ejemplos de administración en la nube? Selecciona dos.',
          o: ['Escalado automático según la demanda', 'Usar el Azure portal', 'Supervisión con alertas automáticas', 'Usar Azure CLI o la API REST'], a: [1, 3],
          why: 'Portal, CLI y API son herramientas con las que tú administras los recursos (en la nube). El escalado automático y las alertas son administración de la nube.', d: 2 },
        { t: 'multi', q: '¿Qué dos elementos contribuyen a la previsibilidad del rendimiento? Selecciona dos.',
          o: ['Calculadora de precios', 'Escalado automático', 'Calculadora de TCO', 'Equilibrio de carga'], a: [1, 3],
          why: 'El escalado automático y el equilibrio de carga (junto con la alta disponibilidad) aseguran un rendimiento predecible. Las calculadoras ayudan a prever costos, no rendimiento.', d: 2 },
        { t: 'multi', q: '¿Qué dos capacidades de la nube apoyan la gobernanza? Selecciona dos.',
          o: ['Plantillas que aplican estándares corporativos', 'Detección de recursos que no cumplen las normas', 'Eliminación total de la responsabilidad del cliente', 'Garantía de 100 % de disponibilidad'], a: [0, 1],
          why: 'La gobernanza se apoya en plantillas estandarizadas y en auditar recursos no conformes. El cliente nunca pierde toda su responsabilidad y ningún SLA garantiza 100 %.', d: 2 },
        { t: 'yn', q: 'Para cada afirmación, selecciona Sí o No.',
          s: [
            { text: 'Un SLA del 99,9 % permite más tiempo de inactividad que uno del 99,99 %.', a: true },
            { text: 'Un SLA del 99,99 % garantiza que el servicio nunca dejará de estar disponible.', a: false },
            { text: 'Si Microsoft incumple un SLA, normalmente el cliente recibe créditos de servicio.', a: true }
          ],
          why: 'Menos nueves = más inactividad permitida. Ningún SLA garantiza cero caídas; define compensaciones (créditos) si no se cumple.', d: 1 },
        { t: 'yn', q: 'Para cada afirmación, selecciona Sí o No.',
          s: [
            { text: 'Escalar verticalmente significa añadir más máquinas.', a: false },
            { text: 'La elasticidad incluye reducir recursos cuando baja la demanda.', a: true },
            { text: 'El escalado horizontal suele combinarse con un equilibrador de carga.', a: true }
          ],
          why: 'Añadir máquinas es horizontal; el vertical da más potencia a una. La elasticidad sube y baja; el equilibrador reparte tráfico entre instancias.', d: 1 },
        { t: 'yn', q: 'Para cada afirmación, selecciona Sí o No.',
          s: [
            { text: 'En IaaS, el cliente es responsable de aplicar los parches del sistema operativo.', a: true },
            { text: 'En SaaS, el cliente debe aplicar los parches de la aplicación.', a: false },
            { text: 'Las plantillas ayudan a que los recursos desplegados cumplan los estándares de la organización.', a: true }
          ],
          why: 'En IaaS el SO es tuyo; en SaaS el proveedor mantiene la aplicación. Las plantillas estandarizan despliegues, clave para la gobernanza.', d: 2 },
        { t: 'yn', q: 'Para cada afirmación, selecciona Sí o No.',
          s: [
            { text: 'Crear recursos desde el Azure portal es un ejemplo de administración en la nube.', a: true },
            { text: 'El escalado automático según la demanda es un ejemplo de administración de la nube.', a: true },
            { text: 'Las plantillas ARM o Bicep solo pueden usarse desde el Azure portal.', a: false }
          ],
          why: 'Portal = administración en la nube; escalado automático = de la nube. Las plantillas también se despliegan con CLI, PowerShell, API o canalizaciones.', d: 2 },
        { t: 'drop', q: 'Agregar más instancias de una máquina virtual para repartir la carga se llama escalado ___.',
          o: ['vertical', 'horizontal', 'diagonal'], a: 1,
          why: 'Más instancias = escalado horizontal (scale out). El vertical aumenta la potencia de una sola instancia.', d: 1 },
        { t: 'drop', q: 'Un SLA del 99,9 % permite aproximadamente ___ de inactividad al mes.',
          o: ['43 minutos', '4 minutos', '7 horas'], a: 0,
          why: '99,9 % ≈ 43,8 minutos al mes. 4 minutos corresponden a 99,99 % y 7 horas a 99 %.', d: 2 },
        { t: 'drop', q: 'La capacidad de ajustar automáticamente los recursos al alza y a la baja según la demanda se denomina ___.',
          o: ['confiabilidad', 'gobernanza', 'elasticidad', 'previsibilidad'], a: 2,
          why: 'Elasticidad es el ajuste automático en ambos sentidos. Confiabilidad es recuperarse de fallos y gobernanza es imponer estándares.', d: 1 },
        { t: 'match', q: 'Relaciona cada concepto con su descripción.',
          pairs: [
            ['Escalado vertical', 'Más CPU/RAM a una misma VM'],
            ['Escalado horizontal', 'Más instancias de la aplicación'],
            ['Alta disponibilidad', 'Servicio accesible según el SLA'],
            ['Confiabilidad', 'Recuperarse de fallos y seguir funcionando']
          ],
          why: 'Vertical potencia una máquina, horizontal añade máquinas, alta disponibilidad mantiene el acceso y confiabilidad permite recuperarse de fallos.', d: 1 },
        { t: 'match', q: 'Relaciona cada SLA con su inactividad mensual aproximada.',
          pairs: [
            ['99 %', '~7,3 horas'],
            ['99,9 %', '~43,8 minutos'],
            ['99,95 %', '~21,9 minutos'],
            ['99,99 %', '~4,4 minutos']
          ],
          why: 'Un mes tiene unas 730 horas. 1 % son 7,3 h; 0,1 % son 43,8 min; 0,05 % son 21,9 min y 0,01 % son 4,4 min.', d: 3 }
      ] },

      { t: 'multi', q: 'Ya existe un grupo de administración para Ventas. Quieres que la misma asignación de roles se aplique a sus 12 suscripciones con el mínimo esfuerzo. ¿Qué dos acciones realizas? Selecciona dos.',
        o: ['Mover las suscripciones a ese grupo de administración', 'Asignar el rol en el grupo de administración', 'Crear un grupo de recursos que contenga las suscripciones', 'Asignar el rol en cada recurso', 'Crear una región soberana'], a: [0, 1],
        why: 'Con las suscripciones dentro del grupo de administración, un solo rol asignado ahí se hereda en todas. Los grupos de recursos no contienen suscripciones.', d: 2 },
      { t: 'yn', q: 'Para cada afirmación, selecciona Sí o No.',
        s: [
          { text: 'Todas las regiones de Azure admiten zonas de disponibilidad.', a: false },
          { text: 'Cada zona de disponibilidad tiene energía, refrigeración y red independientes.', a: true },
          { text: 'Una zona de disponibilidad puede estar formada por uno o más centros de datos.', a: true }
        ],
        why: 'No todas las regiones tienen zonas. Cada zona es independiente en energía, refrigeración y red, y puede abarcar uno o varios centros de datos.', d: 2 },
      { t: 'yn', q: 'Para cada afirmación, selecciona Sí o No.',
        s: [
          { text: 'Una suscripción solo puede tener un grupo de administración primario.', a: true },
          { text: 'Los grupos de recursos se pueden anidar.', a: false },
          { text: 'Una directiva asignada a una suscripción se aplica a sus grupos de recursos.', a: true }
        ],
        why: 'Cada suscripción o grupo de administración tiene un solo padre. Los grupos de recursos no se anidan. Las directivas se heredan hacia abajo.', d: 2 },
      { t: 'yn', q: 'Para cada afirmación, selecciona Sí o No.',
        s: [
          { text: 'Azure China está operada por 21Vianet.', a: true },
          { text: 'Cualquier cliente puede crear recursos en Azure Government con su suscripción comercial.', a: false },
          { text: 'Las regiones soberanas están aisladas de la instancia pública global de Azure.', a: true }
        ],
        why: 'Azure China la opera 21Vianet. Azure Government solo admite a entidades gubernamentales de EE. UU. y sus socios aprobados, con suscripciones propias. Ambas están aisladas de la nube pública.', d: 2 },
      { t: 'yn', q: 'Para cada afirmación, selecciona Sí o No.',
        s: [
          { text: 'Todas las regiones de Azure tienen una región emparejada.', a: false },
          { text: 'Las regiones de un par suelen estar en la misma geografía.', a: true },
          { text: 'Los pares de regiones ayudan a la recuperación ante desastres regionales.', a: true }
        ],
        why: 'Algunas regiones nuevas no tienen par y usan zonas de disponibilidad. Los pares suelen compartir geografía (residencia de datos) y se usan para recuperación ante desastres.', d: 2 },
      { t: 'drop', q: 'Un ___ es un contenedor lógico que agrupa recursos relacionados que comparten ciclo de vida.',
        o: ['grupo de recursos', 'grupo de administración', 'par de regiones', 'centro de datos'], a: 0,
        why: 'El grupo de recursos agrupa recursos para administrarlos, protegerlos y eliminarlos juntos. El grupo de administración agrupa suscripciones, no recursos.', d: 1 },
      { t: 'drop', q: 'Para organizar varias suscripciones y aplicarles gobernanza común se usan ___.',
        o: ['etiquetas', 'grupos de administración', 'zonas de disponibilidad', 'grupos de recursos'], a: 1,
        why: 'Los grupos de administración están por encima de las suscripciones y heredan directivas y roles hacia ellas. Las etiquetas solo clasifican.', d: 1 },
      { t: 'drop', q: 'Un servicio con ___ replica automáticamente sus datos o instancias en varias zonas de la región.',
        o: ['implementación zonal', 'región soberana', 'redundancia de zona', 'un grupo de administración'], a: 2,
        why: 'Los servicios con redundancia de zona (por ejemplo, almacenamiento ZRS) se replican solos entre zonas. Un servicio zonal se fija a una sola zona elegida por ti.', d: 2 },
      { t: 'match', q: 'Relaciona cada concepto físico con su descripción.',
        pairs: [
          ['Región', 'Área geográfica con uno o más centros de datos'],
          ['Zona de disponibilidad', 'Centros de datos separados dentro de una región'],
          ['Par de regiones', 'Dos regiones de una geografía para recuperación ante desastres'],
          ['Centro de datos', 'Edificio con servidores, energía y refrigeración']
        ],
        why: 'De lo grande a lo pequeño: región, zona y centro de datos. El par de regiones une dos regiones para resiliencia ante desastres.', d: 1 },
      { t: 'match', q: 'Relaciona cada nivel de la jerarquía con su función.',
        pairs: [
          ['Grupo de administración', 'Agrupa suscripciones para gobernanza'],
          ['Suscripción', 'Límite de facturación y de acceso'],
          ['Grupo de recursos', 'Contenedor lógico con ciclo de vida común'],
          ['Recurso', 'Instancia de un servicio, como una VM']
        ],
        why: 'Jerarquía: grupos de administración > suscripciones > grupos de recursos > recursos. Cada nivel hereda directivas y roles del superior.', d: 1 }
    ] },

  // ───────────────────────── w2l2 ─────────────────────────
  { id: 'w2l2', title: 'Proceso y hospedaje de aplicaciones', minutes: 7,
    goal: 'Elegir entre VM, contenedores, funciones y App Service según el escenario, y saber qué piezas necesita una VM.',
    lesson: [
      { type: 'text', title: 'Tres formas de ejecutar código',
        body: '**Máquinas virtuales**: virtualizan el hardware; tú controlas el SO (IaaS).\n**Contenedores**: empaquetan la app con sus dependencias y comparten el kernel del host; ligeros y portables.\n**Funciones**: solo escribes código que reacciona a eventos; Azure pone y escala la infraestructura (sin servidor).' },
      { type: 'compare', title: 'VM vs contenedores vs funciones',
        head: ['', 'Máquinas virtuales', 'Contenedores', 'Funciones'],
        rows: [
          ['Virtualiza', 'El hardware (SO completo)', 'El SO (comparten kernel)', 'Nada que gestionar'],
          ['Arranque', 'Minutos', 'Segundos', 'Por evento'],
          ['Control', 'Total', 'Medio', 'Mínimo'],
          ['Ideal para', 'Lift-and-shift, SO a medida', 'Microservicios, portabilidad', 'Tareas cortas por eventos']
        ] },
      { type: 'analogy',
        body: 'Una VM es alquilar un apartamento entero: lo amueblas y lo mantienes tú. Un contenedor es una habitación en un coliving: llegas con tu maleta y funciona igual en cualquier sede. Una función es un taxi: no tienes coche, pagas solo por cada trayecto.' },
      { type: 'cards', title: 'Familia de máquinas virtuales',
        items: [
          { title: 'Azure Virtual Machines', body: 'IaaS: eliges imagen, tamaño (CPU/RAM) y administras el SO, parches y software.' },
          { title: 'Conjuntos de escalado', body: 'Grupo de VM idénticas con equilibrio de carga que **aumenta o reduce** instancias automáticamente según la demanda o un horario.' },
          { title: 'Conjuntos de disponibilidad', body: 'Reparten VM en **dominios de error** (hardware, energía, red) y **de actualización** (mantenimiento). Sin costo extra: pagas las VM.' },
          { title: 'Azure Virtual Desktop', body: 'Escritorios y apps Windows en la nube, incluso **Windows 11 multisesión**, accesibles desde cualquier dispositivo. Los datos no se quedan en el equipo.' },
          { title: 'Lo que necesita una VM', body: 'Tamaño, disco del SO (disco administrado), red virtual con subred, interfaz de red (NIC), IP pública opcional y NSG como firewall.' }
        ] },
      { type: 'flip', title: 'Dominios',
        items: [
          { front: 'Dominio de error', back: 'Grupo de VM que comparten energía y conmutador de red (un rack). Hasta 3 en un conjunto de disponibilidad.' },
          { front: 'Dominio de actualización', back: 'Grupo de VM que se reinician juntas en mantenimiento planeado. Azure actualiza un dominio a la vez (hasta 20).' }
        ] },
      { type: 'trap',
        body: '**Conjuntos de disponibilidad vs zonas**: un conjunto de disponibilidad protege ante fallos de rack y mantenimiento **dentro de un centro de datos**. Si el enunciado habla de sobrevivir a la caída de **un centro de datos completo**, la respuesta es **zonas de disponibilidad**. Y un conjunto de escalado es para **escalar**, no solo para disponibilidad.' },
      { type: 'cards', title: 'Opciones de hospedaje',
        items: [
          { title: 'Azure App Service', body: 'PaaS para **aplicaciones web, API y WebJobs** (tareas en segundo plano). Escalado automático, ranuras de implementación, sin parches de SO.' },
          { title: 'Azure Container Instances', body: 'La forma más simple de ejecutar **un contenedor** sin VM ni orquestador. Pagas por segundo.' },
          { title: 'Azure Container Apps', body: 'Contenedores **sin servidor** para microservicios: escalado por HTTP o eventos, incluso a cero, sin administrar Kubernetes.' },
          { title: 'Azure Kubernetes Service', body: 'Kubernetes administrado: control total del orquestador para muchos contenedores a gran escala.' },
          { title: 'Azure Functions', body: 'Código sin servidor ante **desencadenadores** (HTTP, temporizador, cola, blob…). En el **plan de consumo** pagas por ejecución y escala a cero.' }
        ] },
      { type: 'sort', title: '¿Qué tipo de proceso encaja?',
        buckets: ['Máquinas virtuales', 'Contenedores', 'Azure Functions'],
        items: [
          { text: 'Migrar un servidor con software heredado que exige acceso al SO', bucket: 0 },
          { text: 'Redimensionar una imagen cada vez que se sube a Blob Storage', bucket: 2 },
          { text: 'Microservicios orquestados con Kubernetes', bucket: 1 },
          { text: 'Ejecutar código cada noche a las 2:00 con un temporizador', bucket: 2 },
          { text: 'Empaquetar una app para que corra igual en cualquier entorno', bucket: 1 },
          { text: 'Instalar un controlador personalizado en el sistema operativo', bucket: 0 }
        ] },
      { type: 'trap',
        body: '**ACI vs Container Apps vs AKS**: un contenedor suelto o un trabajo rápido → **Container Instances**. Microservicios sin servidor que escalan a cero sin tocar Kubernetes → **Container Apps**. Control total de Kubernetes → **AKS**.' },
      { type: 'check',
        q: '¿Qué recurso actúa como firewall de red para una VM, permitiendo o denegando tráfico con reglas?',
        o: ['Interfaz de red (NIC)', 'Grupo de seguridad de red (NSG)', 'Dirección IP pública'],
        a: 1, why: 'El NSG contiene reglas de seguridad de entrada y salida. La NIC conecta la VM a la red y la IP pública la hace accesible desde internet.' },
      { type: 'keypoints', items: [
        'VM = control total (IaaS); contenedores = ligeros y portables; funciones = sin servidor ante eventos.',
        'Conjunto de escalado = más o menos VM según demanda; conjunto de disponibilidad = dominios de error y de actualización.',
        'Caída de un centro de datos completo → zonas de disponibilidad, no conjuntos de disponibilidad.',
        'App Service: web, API y WebJobs sin administrar el SO.',
        'ACI = un contenedor simple; Container Apps = sin servidor; AKS = Kubernetes administrado.'
      ] }
    ],
    questions: [
      { t: 'single', q: 'Una empresa debe migrar una aplicación que requiere una versión específica de Windows Server y acceso de administrador al sistema operativo. ¿Qué servicio usa?',
        o: ['Azure Functions', 'Azure Container Instances', 'Azure Virtual Machines', 'Azure App Service'], a: 2,
        why: 'Solo las VM (IaaS) dan control total del SO. Functions y App Service abstraen el SO, y los contenedores comparten el kernel del host.', d: 1 },
      { t: 'single', q: 'Una tienda online tiene picos de tráfico en Black Friday y necesita que el número de VM idénticas aumente y disminuya automáticamente. ¿Qué usa?',
        o: ['Conjuntos de escalado de máquinas virtuales', 'Conjuntos de disponibilidad', 'Azure Virtual Desktop', 'Grupos de recursos'], a: 0,
        why: 'Los conjuntos de escalado crean y eliminan VM idénticas según la demanda. Los conjuntos de disponibilidad no escalan; solo reparten VM entre dominios.', d: 1 },
      { t: 'single', q: 'En un conjunto de disponibilidad, ¿cómo se llama el grupo de VM que comparten fuente de energía y conmutador de red?',
        o: ['Dominio de actualización', 'Zona de disponibilidad', 'Par de regiones', 'Dominio de error'], a: 3,
        why: 'Un dominio de error representa hardware compartido (un rack). El dominio de actualización agrupa VM que se reinician juntas por mantenimiento.', d: 1 },
      { t: 'single', q: '¿Qué garantizan los dominios de actualización de un conjunto de disponibilidad?',
        o: ['Que las VM estén en regiones diferentes', 'Que no todas las VM se reinicien a la vez durante el mantenimiento planeado', 'Que las VM tengan siempre la última versión del SO', 'Que el número de VM se ajuste a la demanda'], a: 1,
        why: 'Azure aplica el mantenimiento planeado a un dominio de actualización a la vez, de modo que siempre quedan VM en servicio. No escalan ni actualizan tu SO.', d: 2 },
      { t: 'single', q: 'Una consultora debe dar escritorios Windows 11 a 200 contratistas que usan equipos personales, sin que los datos corporativos queden en esos dispositivos. ¿Qué servicio elige?',
        o: ['Azure App Service', 'Azure Virtual Desktop', 'Azure Container Apps', 'Azure Functions'], a: 1,
        why: 'Azure Virtual Desktop entrega escritorios y aplicaciones Windows virtualizados; los datos permanecen en Azure. Los otros servicios hospedan aplicaciones, no escritorios.', d: 1 },
      { t: 'single', q: 'Un equipo quiere publicar API web en .NET y Python sin administrar servidores ni parches del SO, con ranuras de implementación y escalado automático. ¿Qué servicio usa?',
        o: ['Azure Virtual Machines', 'Azure Kubernetes Service', 'Azure Container Instances', 'Azure App Service'], a: 3,
        why: 'App Service es PaaS para web y API con ranuras de implementación y escalado automático. En VM administras el SO; AKS requiere gestionar Kubernetes; ACI no ofrece ranuras.', d: 2 },
      { t: 'single', q: 'Necesitas ejecutar un contenedor para un trabajo por lotes de 10 minutos, sin orquestación ni VM que administrar. ¿Qué es lo más sencillo?',
        o: ['Azure Container Instances', 'Azure Kubernetes Service', 'Conjuntos de escalado de máquinas virtuales', 'Azure Virtual Desktop'], a: 0,
        why: 'ACI ejecuta un contenedor en segundos y cobra por segundo, sin orquestador. AKS sería excesivo y un conjunto de escalado implica administrar VM.', d: 1 },
      { t: 'single', q: '¿Con qué plan de Azure Functions pagas solo por las ejecuciones y la aplicación escala a cero cuando no hay actividad?',
        o: ['Plan dedicado de App Service', 'Instancia reservada', 'Plan de consumo', 'Ventaja híbrida de Azure'], a: 2,
        why: 'El plan de consumo es sin servidor: escala automáticamente y cobras por ejecución y recursos usados. El plan dedicado paga instancias aunque estén ociosas.', d: 2 },
      { t: 'single', q: 'Una empresa ejecuta cientos de microservicios en contenedores y necesita control total del orquestador mediante la API de Kubernetes. ¿Qué servicio elige?',
        o: ['Azure Container Instances', 'Azure Functions', 'Azure Kubernetes Service (AKS)', 'Azure App Service'], a: 2,
        why: 'AKS es Kubernetes administrado con acceso completo a su API. ACI no orquesta y Functions o App Service no exponen Kubernetes.', d: 2 },
      { t: 'single', q: 'Una startup quiere ejecutar microservicios en contenedores sin servidor, que escalen a cero según solicitudes HTTP o eventos, sin administrar Kubernetes. ¿Qué usa?',
        o: ['Azure Container Apps', 'Azure Kubernetes Service', 'Azure Virtual Machines', 'Azure Virtual Desktop'], a: 0,
        why: 'Container Apps es la opción sin servidor para microservicios en contenedores y oculta Kubernetes. AKS exige administrar el clúster.', d: 3 },
      { t: 'single', q: '¿Qué recurso conecta una VM a una red virtual?',
        o: ['Grupo de seguridad de red', 'Interfaz de red (NIC)', 'Disco del sistema operativo', 'Conjunto de disponibilidad'], a: 1,
        why: 'La NIC une la VM con una subred de la red virtual. El NSG filtra tráfico, el disco guarda el SO y el conjunto de disponibilidad reparte VM.', d: 1 },
      { t: 'single', q: '¿Qué característica de App Service ejecuta programas o scripts en segundo plano en el mismo contexto que una aplicación web?',
        o: ['Azure Functions Premium', 'Trabajos de Container Apps', 'Azure Batch', 'WebJobs'], a: 3,
        why: 'WebJobs es una característica de App Service para tareas en segundo plano junto a la app web. Las demás opciones son servicios independientes.', d: 2 },
      { t: 'multi', q: 'Al crear una VM en Azure, ¿qué dos de estos recursos se requieren además de la propia VM? Selecciona dos.',
        o: ['Interfaz de red (NIC)', 'Grupo de administración', 'Disco del sistema operativo', 'Conjunto de escalado', 'Aplicación de funciones'], a: [0, 2],
        why: 'Toda VM necesita al menos una NIC (conectada a una red virtual) y un disco de SO. Grupos de administración y conjuntos de escalado son opcionales.', d: 1 },
      { t: 'multi', q: '¿Qué dos características describen Azure Functions? Selecciona dos.',
        o: ['Se ejecuta ante desencadenadores como HTTP, temporizador o mensajes en cola', 'Requiere administrar el sistema operativo', 'Puede escalar automáticamente según la demanda', 'Siempre requiere un clúster de Kubernetes', 'Solo admite C#'], a: [0, 2],
        why: 'Functions es sin servidor, basada en eventos y escala sola. No administras SO ni Kubernetes y admite varios lenguajes.', d: 1 },
      { t: 'multi', q: '¿Qué dos ventajas tienen los contenedores frente a las máquinas virtuales? Selecciona dos.',
        o: ['Cada uno incluye su propio SO completo', 'Arrancan en segundos', 'Ofrecen más control del hardware', 'Son más ligeros y portables'], a: [1, 3],
        why: 'Los contenedores comparten el kernel del host, por eso arrancan rápido y son ligeros y portables. Las VM son las que incluyen SO completo y más control.', d: 2 },
      { t: 'multi', q: 'Una aplicación en dos VM debe sobrevivir a la caída completa de un centro de datos dentro de la región. ¿Qué dos opciones lo logran? Selecciona dos.',
        o: ['Implementar las VM en distintas zonas de disponibilidad', 'Usar un conjunto de disponibilidad con 3 dominios de error', 'Usar un conjunto de escalado distribuido en varias zonas', 'Aumentar el tamaño de las VM', 'Agregar un segundo disco de datos'], a: [0, 2],
        why: 'Solo repartir VM entre zonas protege ante la caída de un centro de datos; un conjunto de escalado puede abarcar zonas. Un conjunto de disponibilidad protege racks, no edificios.', d: 3 },
      { t: 'yn', q: 'Para cada afirmación, selecciona Sí o No.',
        s: [
          { text: 'Crear un conjunto de disponibilidad no tiene costo adicional; solo pagas las VM.', a: true },
          { text: 'Un conjunto de disponibilidad distribuye las VM entre varias regiones.', a: false },
          { text: 'Las VM de un conjunto se reparten entre dominios de error y de actualización.', a: true }
        ],
        why: 'El conjunto es gratis y reparte VM en dominios de error y actualización dentro de un centro de datos, nunca entre regiones.', d: 2 },
      { t: 'yn', q: 'Para cada afirmación, selecciona Sí o No.',
        s: [
          { text: 'App Service puede hospedar aplicaciones web, API REST y WebJobs.', a: true },
          { text: 'En App Service tú aplicas los parches del sistema operativo.', a: false },
          { text: 'App Service admite escalado automático.', a: true }
        ],
        why: 'App Service es PaaS: Microsoft parchea el SO, y tú hospedas web, API y WebJobs con escalado automático.', d: 1 },
      { t: 'yn', q: 'Para cada afirmación, selecciona Sí o No.',
        s: [
          { text: 'Azure Functions es un servicio de proceso sin servidor.', a: true },
          { text: 'En el plan de consumo pagas instancias aunque no haya ejecuciones.', a: false },
          { text: 'Un temporizador puede desencadenar una función.', a: true }
        ],
        why: 'Functions es sin servidor; en el plan de consumo pagas por ejecución y escala a cero. Los temporizadores son un desencadenador habitual.', d: 1 },
      { t: 'yn', q: 'Para cada afirmación, selecciona Sí o No.',
        s: [
          { text: 'Azure Virtual Desktop admite Windows 11 multisesión.', a: true },
          { text: 'Con Azure Virtual Desktop los usuarios pueden conectarse desde distintos dispositivos.', a: true },
          { text: 'Azure Virtual Desktop requiere instalar las aplicaciones en cada dispositivo del usuario.', a: false }
        ],
        why: 'AVD ofrece Windows multisesión y acceso desde varios dispositivos; las apps se ejecutan en Azure, no en el equipo del usuario.', d: 2 },
      { t: 'drop', q: 'Un ___ filtra el tráfico entrante y saliente de una VM mediante reglas de seguridad.',
        o: ['grupo de seguridad de red (NSG)', 'dominio de error', 'conjunto de escalado', 'WebJob'], a: 0,
        why: 'El NSG permite o deniega tráfico por puerto, protocolo y origen. Las otras opciones no filtran tráfico.', d: 1 },
      { t: 'drop', q: 'Para orquestar contenedores con Kubernetes administrado se usa ___.',
        o: ['Azure Container Instances', 'Azure Kubernetes Service', 'Azure Functions', 'Azure Virtual Desktop'], a: 1,
        why: 'AKS es el servicio de Kubernetes administrado. ACI ejecuta contenedores sueltos sin orquestador.', d: 1 },
      { t: 'drop', q: 'La forma más rápida y sencilla de ejecutar un solo contenedor en Azure, sin orquestador, es ___.',
        o: ['AKS', 'Azure Virtual Desktop', 'Azure Container Instances', 'un conjunto de disponibilidad'], a: 2,
        why: 'Container Instances ejecuta un contenedor en segundos sin VM ni clúster que administrar.', d: 1 },
      { t: 'match', q: 'Relaciona cada servicio con su caso de uso.',
        pairs: [
          ['Azure App Service', 'Hospedar aplicaciones web y API como PaaS'],
          ['Azure Functions', 'Ejecutar código sin servidor ante eventos'],
          ['Azure Kubernetes Service', 'Orquestar contenedores a gran escala'],
          ['Azure Virtual Machines', 'Control total del sistema operativo']
        ],
        why: 'App Service = web y API; Functions = eventos sin servidor; AKS = orquestación; VM = IaaS con control del SO.', d: 1 },
      { t: 'match', q: 'Relaciona cada mecanismo con aquello de lo que protege o lo que hace.',
        pairs: [
          ['Dominio de error', 'Fallos de hardware, energía o red de un rack'],
          ['Dominio de actualización', 'Reinicios por mantenimiento planeado'],
          ['Zona de disponibilidad', 'Caída de un centro de datos completo'],
          ['Conjunto de escalado', 'Ajustar el número de VM a la demanda']
        ],
        why: 'Error = rack; actualización = mantenimiento; zona = centro de datos; conjunto de escalado = elasticidad.', d: 2 }

  // ───────────────────────── w2l3 ─────────────────────────
  { id: 'w2l3', title: 'Redes de Azure', minutes: 6,
    goal: 'Diseñar la conectividad básica: redes virtuales, emparejamiento, DNS, VPN, ExpressRoute y puntos de conexión privados.',
    lesson: [
      { type: 'text', title: 'Redes virtuales (VNet)',
        body: 'Una **red virtual** es tu red privada en Azure. Sirve para: **aislar y segmentar** recursos, comunicarse con **internet**, entre **recursos de Azure** y con tu **red local**, además de **enrutar y filtrar** tráfico.\nUna VNet vive en **una región** y una suscripción, y abarca todas las zonas de esa región.' },
      { type: 'cards', title: 'Piezas clave',
        items: [
          { title: 'Subred', body: 'Segmento del espacio de direcciones de la VNet. Separas capas (web, datos) y les asocias NSG.' },
          { title: 'Emparejamiento de redes virtuales', body: 'Une dos VNet con IP privadas por la **red troncal de Microsoft**. El emparejamiento global funciona **entre regiones**.' },
          { title: 'Azure DNS', body: 'Hospeda zonas DNS (públicas y privadas) en la infraestructura de Azure. **No vende dominios**: se compran en un registrador.' },
          { title: 'Punto de conexión privado', body: 'Da a un servicio PaaS una **IP privada de tu VNet** con **Azure Private Link**. Puedes cerrar el acceso público.' }
        ] },
      { type: 'analogy',
        body: 'La VNet es tu edificio de oficinas y las subredes son sus pisos. El emparejamiento es un pasillo cubierto hacia otro edificio. La VPN es un furgón blindado que circula por la vía pública (internet). ExpressRoute es una carretera privada que solo usas tú.' },
      { type: 'flip', title: 'Tipos de VPN Gateway',
        items: [
          { front: 'Sitio a sitio', back: 'Conecta **toda una red local** (oficina) con la VNet mediante un dispositivo VPN local. Túnel IPsec/IKE por internet.' },

  { id: 'w2l4', title: 'Almacenamiento', minutes: 7,

      { t: 'single', q: 'Una empresa necesita protección ante la caída de una zona en la región primaria y poder leer los datos en la región secundaria en todo momento. ¿Qué redundancia elige?',
